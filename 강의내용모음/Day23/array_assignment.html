<!DOCTYPE html>

    <meta charset="UTF-8" />

    <title>Document</title>
  </head>
  <body>
    <script>
      // 출석부 배열
      var 출석부 = ["흥민", "영희", "철수", "재석"];

      function 이름찾기() {
        // '흥민'과 '철수'가 출석부에 존재하면 '있어요'를 출력
        if (출석부.includes("흥민") && 출석부.includes("철수")) {
          console.log("있어요");
        } else {
          console.log("없어요");
        }
      }

      이름찾기(); // 함수 호출
    </script>

    <script>
      function 함수(arr, b) {
        // arr 배열에 있는 모든 숫자의 합을 구합니다.
        var sum = 0;
        for (var i = 0; i < arr.length; i++) {
          sum += arr[i];
        }

        // 평균을 계산합니다.
        var avg = sum / arr.length;

        // b와 평균을 비교합니다.
        if (b > avg) {
          console.log("올랐네요");
        } else {
          console.log("재수추천");
        }
      }

      // 함수 호출 예시
      함수([10, 20, 30], 25);
    </script>
