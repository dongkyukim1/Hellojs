<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 목록</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <div class="container">
      <div class="row" id="product-container">
        <!-- JavaScript로 동적으로 추가될 영역 -->
      </div>
    </div>

    <script>
      var products = [
        { id: 0, price: 7000, title: "blossom dress" },
        { id: 1, price: 8000, title: "black dress" },
        { id: 2, price: 9000, title: "white dress" },
      ];

      function renderProducts(products) {
        var container = document.getElementById("product-container");

        for (var i = 0; i < products.length; i++) {
          var productHTML = `
            <div class="col-sm-4">
             <img src="https://placehold.co/600x400" class="w-100" />
              <h5>${products[i].title}</h5>
              <p>가격 : ${products[i].price}원</p>
            </div>
          `;

          container.innerHTML += productHTML;
        }
      }

      // 함수 실행하여 상품 목록을 HTML에 추가
      renderProducts(products);
    </script>
  </body>
</html>
