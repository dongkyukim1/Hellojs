<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
/>
<form class="container my-5 form-group">
    <p>상품선택</p>
    <select class="form-select mt-2">
      <option value="">상품을 선택하세요</option>
      <option value="모자">모자</option>
      <option value="셔츠">셔츠</option>
      <option value="바지">바지</option>
    </select>
  
    <select class="form-select mt-2 form-hide">
    </select>
</form>

<style>
    .form-hide {
      display: none;
    }
</style>

<!-- jQuery 추가 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    // 상품별 옵션 데이터
    var options = {
        "모자": ["S", "M", "L"],
        "셔츠": ["95", "100", "150"],
        "바지": [28, 30, 32]
    };

    $(document).ready(function () {
        $('.form-select').eq(0).on('change', function () {
            var selectedProduct = $(this).val();
            var sizeSelect = $('.form-select').eq(1);

            // 기존 옵션 제거
            sizeSelect.empty();

            // 상품이 선택되지 않은 경우, 숨김 처리 후 종료
            if (!selectedProduct) {
                sizeSelect.addClass('form-hide');
                return;
            }

            // 옵션이 존재하는 경우 `forEach`를 사용하여 추가
            if (options[selectedProduct]) {
                options[selectedProduct].forEach((size) => {
                    sizeSelect.append(`<option>${size}</option>`);
                });
            }

            // 두 번째 select 표시
            sizeSelect.removeClass('form-hide');
        });
    });
</script>
<script>
// 일반 함수 (function 키워드 사용)
function add(a, b) {
    return a + b;
}

// 화살표 함수
const addArrow = (a, b) => a + b;

console.log(add(2, 3));       // 5
console.log(addArrow(2, 3));  // 5

const obj = {
    value: 42,
    getValue: function() {
        return this.value;
    }
};

console.log(obj.getValue());  // 42


const objArrow = {
    value: 42,
    getValue: () => {
        return this.value;
    }
};

console.log(objArrow.getValue());  // undefined
</script>
