    <!-- Q3. 이자율 계산하기 

철수는 은행에 예금을 하러 갔는데 예금 금액에 따라 이율이 달라지는 것을 보고 크게 당황했습니다.

첫 예금액이 5만원 미만이면 이율이 연 15퍼센트,

첫 예금액이 5만원 이상이면 이율이 연 20퍼센트라고 합니다.

그래서 민준이는

(1) 변수에 예금액을 넣으면

(2) 2년 후의 총 예금액을 자동으로 콘솔창에 출력해주는 기능을 자바스크립트로 만들려고하는데

어떻게 코드를 짜면 될까요?  -->

<!-- Q4. 커피 리필을 이상하게 해주는 곳이 있습니다. 최대한 마실 수 있는 커피양을 계산해봅시다. 


방금 마신 커피의 3분의 2만큼 총 2번 리필해주는 카페가 있습니다.

예를 들면 처음 커피를 90ml 주문하면 첫 리필은 60ml를 해주며, 그 다음 리필은 40ml를 해주는 카페입니다.

그럼 처음 주문한 커피 양에 따라서 최대한 마실 수 있는 커피를 콘솔창에 계산해주는 코드를 작성해봅시다. 

  -->

  <p>태조 이성계가 태어난 년도는?</p>
  <input type="text" id="answer">
  <button id="send-answer">제출</button>
  
  <script>
    var failCount = 0;
    document.getElementById('send-answer').addEventListener('click', function(){
      if(document.getElementById('answer').value === '1993'){
          alert('성공');
          failCount = 0;
      }else{
        failCount++;
        if(failCount>=3){
            alert('3번틀림')
        }
      }
    });
  </script>

<script>
    var 예금액 = 60000;
    var year = 2;
    var 미래예금액 = 0;

    if(예금액 < 50000){
         미래예금액 = 예금액 * (1 + 0.15 * year);
    } else {
         미래예금액 = 예금액 * (1 + 0.2 * year);
    }

    console.log(미래예금액);
</script>
<script>
    // 처음 주문한 커피 양 
    var initialCoffee = 360;
    
    // 첫 번째 리필: 마신 커피의 3분의 2
    var firstRefill = initialCoffee * (2 / 3);
    
    // 두 번째 리필: 첫 번째 리필한 커피의 3분의 2
    var secondRefill = firstRefill * (2 / 3);
    
    // 총 마실 수 있는 커피 양: 처음 주문 + 두 번의 리필
    var totalCoffee = initialCoffee + firstRefill + secondRefill;
    
    console.log("총 마실 수 있는 커피 양: " + totalCoffee + "ml");
  </script>

  </script>
