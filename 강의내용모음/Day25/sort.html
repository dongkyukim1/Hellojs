<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sort</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <!-- 차량 정보 카드 -->
    <div class="container mt-3">
      <div class="card p-3">
        <h4>차량 정보</h4>
        <div id="output"></div>
        <button id="changeCar" class="btn btn-primary mt-2">
          차 정보 변경
        </button>
      </div>
    </div>

    <!-- 정렬/필터 버튼 -->
    <div class="container mt-3">
      <button class="btn btn-success" id="sortAsc">가격 낮은순</button>
      <button class="btn btn-danger" id="sortDesc">가격 높은순</button>
      <button class="btn btn-primary" id="sortRange">가격 범위</button>
      <button class="btn btn-primary" id="sortName">상품 이름순</button>
      <button class="btn btn-secondary" id="reset">돌아가</button>
    </div>

    <!-- 상품 카드 출력 영역 -->
    <div class="card-group container" id="cardContainer">
      <!-- 자바스크립트에서 동적으로 카드 생성 -->
    </div>

    <!-- 필터 예제 콘솔 확인용 -->
    <script>
      var 어레이 = [1, 3, 4, 5, 6, 7];
      var 필터어레이 = 어레이.filter(function (a) {
        return a < 3;
      });
      console.log(필터어레이); // [1]
    </script>

    <!-- 메인 상품 로직 -->
    <script>
      var products = [
        { id: 0, price: 70000, title: "Blossom Dress" },
        { id: 1, price: 50000, title: "Springfield Shirt" },
        { id: 2, price: 60000, title: "Black Monastery" },
      ];

      const originalProducts = [...products]; // 원본 백업

      // 초기 출력
      updateout();

      // 가격 낮은순 정렬
      document.getElementById("sortAsc").addEventListener("click", function () {
        products.sort(function (a, b) {
          return a.price - b.price;
        });
        updateout();
      });

      // 가격 높은순 정렬
      document
        .getElementById("sortDesc")
        .addEventListener("click", function () {
          products.sort(function (a, b) {
            return b.price - a.price;
          });
          updateout();
        });
      // 상품 이름순 정렬
      document
       .getElementById("sortName")
       .addEventListener("click", function () {
          products.sort(function (a, b) {
            return b.title.localeCompare(a.title);
          });
          updateout();
        });  
      // 가격 필터 (예: 50000원인 상품만)
      document
        .getElementById("sortRange")
        .addEventListener("click", function () {
          products = originalProducts.filter(function (a) {
            return a.price <= 60000;
          });
          updateout();
        });

      // 원래대로 초기화
      document.getElementById("reset").addEventListener("click", function () {
        products = [...originalProducts];
        updateout();
      });

      // 카드 렌더링 함수
      function updateout() {
        var container = document.getElementById("cardContainer");
        container.innerHTML = ""; // 기존 카드 삭제

        for (let i = 0; i < products.length; i++) {
          var card = `
            <div class="card m-2" style="width: 18rem;">
              <img src="https://via.placeholder.com/600" class="card-img-top" />
              <div class="card-body">
                <h5 class="title card-title">${products[i].title}</h5>
                <p class="price card-text">가격 : ${products[i].price}</p>
                <button class="btn btn-danger">주문하기</button>
              </div>
            </div>
          `;
          container.innerHTML += card;
        }
      }
    </script>
    <script>
      //어레이 자료 전부 변형 (.map)
      var 어레이 = [1, 3, 4, 5, 6, 7];
      var 변형어레이 = 어레이.map(function (a) {
        return a * 2;
      });
      console.log(변형어레이);
    </script>
  </body>
</html>
