<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array vs Object</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div class="container mt-3">
      <div class="card p-3">
        <h4>차량 정보</h4>
        <div id="output"></div>
        <button id="changeCar" class="btn btn-primary mt-2">
          차 정보 변경
        </button>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      /**
       * ✅ Array (배열) - 순서 기반 데이터 저장
       *  - 정렬 가능
       *  - 특정 범위 잘라내기 가능 (slice)
       */
      var car = ["소나타", 500000, "white"];
      car[0] = "제네시스"; // 값 변경
      console.log("🚗 변경된 첫 번째 요소:", car[0]);

      // 정렬 후 출력
      car.sort();
      console.log("📌 정렬된 배열:", car);

      // 첫 번째 요소 가져오기
      console.log("✂️ 첫 번째 요소 (slice):", car.slice(0, 1));

      /**
       * ✅ Object (객체) - 정보 기반 데이터 저장 (Key-Value)
       *  - 값 변경 가능
       *  - 특정 키 값을 쉽게 가져올 수 있음
       */
      var car2 = { name: "소나타", price: 500000 };

      // 값 가져오기 & 변경
      console.log("🚗 원래 차 이름:", car2["name"]);
      car2.name = "하이";
      console.log("🔄 변경된 차 이름:", car2["name"]);

      // HTML에 데이터 추가
      function updateOutput() {
        document.getElementById("output").innerHTML = `
        <p><strong>🚘 차 이름:</strong> ${car2.name}</p>
        <p><strong>💰 가격:</strong> ${car2.price}원</p>
      `;
      }
      // 페이지 로드 시 기본 정보 출력
      updateOutput();

      document
        .getElementById("changeCar")
        .addEventListener("click", function () {
          car2.name = "제네시스";
          car2.price = 700000;
          updateOutput();
        });
    </script>
  </body>
</html>
