<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑몰 예제</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">🛍 쇼핑몰 예제</h1>

    <!-- 검색창 -->
    <div class="mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="상품명 또는 업체명을 검색하세요...">
    </div>

    <!-- 상품 목록 -->
    <div class="row" id="productList">
      <div class="col-md-3 mb-4" draggable="true" data-id="0">
        <div class="card h-100">
          <img src="pr1.jpg" class="card-img-top" alt="식기세척기">
          <div class="card-body">
            <h5 class="card-title">식기세척기</h5>
            <p class="card-text">세척나라 · 10,000원</p>
            <button class="btn btn-sm btn-outline-dark add-to-cart">담기</button>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-4" draggable="true" data-id="1">
        <div class="card h-100">
          <img src="pr2.jpg" class="card-img-top" alt="원목 침대 프레임">
          <div class="card-body">
            <h5 class="card-title">원목 침대 프레임</h5>
            <p class="card-text">침대나라 · 20,000원</p>
            <button class="btn btn-sm btn-outline-dark add-to-cart">담기</button>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-4" draggable="true" data-id="2">
        <div class="card h-100">
          <img src="pr3.jpg" class="card-img-top" alt="천연 디퓨저 세트">
          <div class="card-body">
            <h5 class="card-title">천연 디퓨저 세트</h5>
            <p class="card-text">향기나라 · 30,000원</p>
            <button class="btn btn-sm btn-outline-dark add-to-cart">담기</button>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-4" draggable="true" data-id="3">
        <div class="card h-100">
          <img src="pr4.jpg" class="card-img-top" alt="시원한 서큘레이터">
          <div class="card-body">
            <h5 class="card-title">시원한 서큘레이터</h5>
            <p class="card-text">바람나라 · 40,000원</p>
            <button class="btn btn-sm btn-outline-dark add-to-cart">담기</button>
          </div>
        </div>
      </div>
    </div>

    <hr class="my-5">

    <!-- 장바구니 영역 -->
    <div class="mb-4">
      <h3>🛒 장바구니</h3>
      <div class="border rounded p-3 bg-light" id="cartDropZone" style="min-height: 150px;">
        <p class="text-muted">여기로 상품을 드래그하거나, 담기 버튼을 누르세요.</p>
        <div id="cartItems" class="row g-3"></div>
      </div>
    </div>

    <!-- 합계 및 결제 버튼 -->
    <div class="d-flex justify-content-between align-items-center">
      <h5>총 합계: <span id="totalPrice">0</span>원</h5>
      <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#purchaseModal">구매하기</button>
    </div>
  </div>

  <!-- 구매 모달 -->
  <div class="modal fade" id="purchaseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">구매 정보 입력</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control mb-2" placeholder="성함" id="buyerName">
          <input type="text" class="form-control" placeholder="연락처" id="buyerPhone">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button class="btn btn-primary" onclick="drawReceipt()">구매 완료</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 영수증 출력 영역 -->
  <div class="container py-5 d-none" id="receiptContainer">
    <h3>🧾 영수증</h3>
    <canvas id="receiptCanvas" width="350" height="500" style="border:1px solid #ccc;"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
