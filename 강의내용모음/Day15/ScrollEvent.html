<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixed Navbar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <style>
      /* 기본 네비게이션 바 스타일 */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease-in-out;
        padding: 15px 20px;
        height: 70px;
      }

      /* 네비게이션 바 축소 시 */
      .navbar.shrink {
        height: 50px;
        padding: 10px 20px;
        background-color: rgba(240, 240, 240, 0.95);
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
      }

      /* 브랜드 로고 크기 조절 */
      .navbar-brand {
        font-size: 1.5rem;
        font-weight: bold;
        transition: font-size 0.3s ease-in-out;
      }

      .navbar.shrink .navbar-brand {
        font-size: 1.2rem;
      }

      /* "Dark" 배지 스타일 개선 */
      .badge {
        font-size: 0.9rem;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.3s ease-in-out;
      }

      .badge:hover {
        background-color: #333;
      }

      /* Lorem 박스 스타일 */
      .lorem {
        width: 300px;
        height: 150px;
        padding: 10px;
        border-radius: 10px;
        overflow-y: scroll;
        transition: background-color 0.3s ease-in-out,
          box-shadow 0.3s ease-in-out;
      }

      /* 스크롤 시 lorem 박스 변화 */
      .lorem.scrolled {
        background-color: lightgray;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
      }

      /* 본문 내용 */
      .content {
        height: 2000px;
        padding-top: 100px;
        text-align: center;
        font-size: 1.2rem;
        color: #444;
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-light">
      <div class="container-fluid d-flex align-items-center">
        <span class="navbar-brand">JSShop</span>
        <span class="ms-auto badge bg-dark">Dark</span>
        <button class="navbar-toggler ms-3" type="button">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="lorem mt-3">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quae voluptas
        voluptatum minus praesentium fugit debitis at, laborum ipsa itaque
        placeat sit, excepturi eius. Nostrum perspiciatis, eligendi quae
        consectetur praesentium exercitationem.
      </div>
    </div>

    <div class="content">
      <p>스크롤을 내려보세요.</p>
    </div>

    <script>
      // 네비게이션 바 축소 효과
      window.addEventListener('scroll', function () {
        let navbar = document.querySelector('.navbar');
        if (window.scrollY > 50) {
          navbar.classList.add('shrink');
        } else {
          navbar.classList.remove('shrink');
        }
      });
    </script>
    <script>
      // Lorem 박스 스타일 변경
      $('.lorem').on('scroll', function () {
        var 스크롤양 = document.querySelector('.lorem').scrollTop;
        if (스크롤양 == 62) {
          alert('끝까지 왔습니다.');
        }
      });
    </script>
  </body>
</html>
