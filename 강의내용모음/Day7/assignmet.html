<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모달창 테스트</title>
    <link rel="stylesheet" href="style1.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- One-way UI 애니메이션 만드는 법
    1.시작스타일
    2.최종스타일
    3.CSS + 클래스로 만들어놓고 자바스크르립트로 변경만함
    4. transition 추가 -->
    <!-- 모달 열기 버튼 -->
    <button class="btn open-modal">모달 열기</button>

    <!-- 기본 모달 -->
    <div class="modal-bg">
        <div class="modal-box">
            <h2>모달 창</h2>
            <p>이것은 기본 모달입니다.</p>
            <button class="btn close-modal">닫기</button>
        </div>
    </div>


    <script>
    $(document).ready(function () {
    // 모달 열기 (open-modal 버튼 클릭 시 실행)
    $('.open-modal').on('click', function () {
        $('.modal-bg').removeClass('fade-out').addClass('fade-in');
    });

    // 모달 닫기 (close-modal 버튼 클릭 시 실행)
    $('.close-modal').on('click', function () {
        $('.modal-bg').removeClass('fade-in').addClass('fade-out');
    });

    // 모달 바깥 배경 클릭 시 닫기
    $('.modal-bg').on('click', function (event) {
        if (event.target === this) {
            $(this).removeClass('fade-in').addClass('fade-out');
        }
    });
});

</script>
</body>
</html>
