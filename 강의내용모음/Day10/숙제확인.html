<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- input 태그 에서만 발생하는 것들 -->
 <form id="login">
    <input type="text" id="id" placeholder="아이디">
    <input type="password" id="pw" placeholder="비밀번호">
    <button type="submit">로그인</button>
 </form>

 <script>
    document.getElementById('login').addEventListener('submit', function(event){
    if(document.getElementById('id').value === '' && document.getElementById('pw').value === ''){
        alert('아이디와 비밀번호를 입력해줘');   
        event.preventDefault();
    }else if(document.getElementById('id').value === '' ){
        alert('아이디입력해');
    }else if(document.getElementById('pw').value === ''){
        alert('비밀번호입력해');
    }else if( document.getElementById('pw').value.length<6){
        alert('비밀밀번호 6자 이상 입력하세요');
        event.preventDefault();    
    
    }
    });
    </script>
    <script>
        document.getElementById('login').addEventListener('change', function(event){
            console.log(event.target.id + '변경'); // id를 console.log 확인할 수 있음. 
        })
    </script>
</body>
</html>
