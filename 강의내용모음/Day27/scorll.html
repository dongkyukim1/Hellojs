<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스크롤위치따라 변하는 애니메이션</title>
    <link href="scroll/main.css" rel="stylesheet" />
  </head>
  <body>
    <!--(1) 카드들이 고정되고 아래에서 올라온 카드가 앞에서 올라온 카드를 덮는다-->
    <!-- (2) 위로 올람오면 뒤에 가는 카드가 점점 opacity 가 줄어들어야함 -->
    <div class="card-background">
      <div class="card-box">
        <img src="scroll/card1.png" />
      </div>
      <div class="card-box">
        <img src="scroll/card2.png" />
      </div>
      <div class="card-box">
        <img src="scroll/card3.png" />
      </div>
    </div>

    <!-- jQuery, Bootstrap JS (CDN) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      $(window).scroll(function () {
        var 높이 = $(window).scrollTop(); // 스크롤바의 현재 위치
        console.log(높이);

        // 측정한 650~1150 까지 스크롤바를 내리면 첫째카드의 오파시티를 1~0으로 서서히 변경

        // 수식 설명:
        // 높이가 650일 때 y가 1
        // 높이가 1150일 때 y가 0
        // → 선형 함수: y = a * 높이 + b 형태
        // 두 점 (650,1), (1150,0)을 지나는 1차 함수 만들기
        // 기울기 a = (0 - 1) / (1150 - 650) = -1 / 500
        // 따라서 y = (-1 / 500) * (높이 - 650) + 1

        // 숙제

        var z = (-0.2 / 500) * (높이 - 650) + 1;
        var y = (-1 / 500) * (높이 - 650) + 1;
        $(".card-box").eq(0).css("opacity", y); // 0으로 하드코딩 못한다! -> 1에서 0.9로 서서히 변하는 변수를 사용해야됨
        $(".card-box")
          .eq(0)
          .css("transform", "scale(" + z + ")");
      });
    </script>
  </body>
</html>
