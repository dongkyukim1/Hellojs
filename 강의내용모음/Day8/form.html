<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 폼</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
            <h4 class="text-center">로그인하세요</h4>
            <form id="loginForm" action="success.html">
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" id="email" class="form-control" placeholder="이메일 입력">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" class="form-control" placeholder="비밀번호 입력">
                </div>
                <button type="submit" class="btn btn-primary w-100">로그인</button>
                <button type="button" class="btn btn-danger w-100 mt-2" id="close">닫기</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS (필요할 경우) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 전송된게 없을때 alert 띄우고 페이지 유지 -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
    
            // 이메일 또는 비밀번호가 없거나 공백만 입력된 경우 제출 차단
            if (email === "" || password === "") {
                alert("이메일과 비밀번호를 모두 입력하세요.");
                event.preventDefault(); // 기본 제출 방지
            }
        });
    
        // 닫기 버튼 클릭 시 로그인 창 숨기기
        document.getElementById("close").addEventListener("click", function() {
            document.querySelector(".container").remove();
        });
    </script>
    

</body>
</html>
