<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiper.js + Chart.js + AOS + EmailJS 예제</title>

    <!-- ✅ Swiper.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- ✅ AOS (스크롤 애니메이션) CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />

    <style>
        /* ✅ Swiper 컨테이너 */
        .swiper {
            width: 100%;
            height: 400px;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ✅ Chart.js 캔버스 크기 */
        canvas {
            width: 100% !important;
            max-width: 600px;
            height: 400px !important;
            display: block;
            margin: 20px auto;
        }

        /* ✅ Contact Form 스타일 */
        form {
            max-width: 400px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
        }
        form label {
            margin-top: 10px;
        }
        form input, form textarea {
            padding: 8px;
            margin-top: 5px;
        }
        form input[type="submit"] {
            margin-top: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ✅ Swiper.js 슬라이더 -->
    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="../images/car1.png" alt="Slide 1" /></div>
            <div class="swiper-slide"><img src="../images/car2.png" alt="Slide 2" /></div>
            <div class="swiper-slide"><img src="../images/car3.png" alt="Slide 3" /></div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>

    <!-- ✅ Chart.js 차트 -->
    <canvas id="myChart"></canvas>

    <!-- ✅ AOS 애니메이션 요소 -->
    <div style="height: 100vh;"></div> <!-- 스크롤 테스트용 공간 추가 -->
    <div data-aos="fade-left" style="width: 200px; height: 200px; background-color: red;">
        왼쪽에서 나타나는 애니메이션
    </div>

    <!-- ✅ EmailJS Contact Form -->
    <form id="contact-form">
        <input type="hidden" name="time" value="Mar 10 2025 08:46">
        <label>Name</label>
        <input type="text" name="name" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Subject</label>
        <input type="text" name="title" required>
        <label>Message</label>
        <textarea name="message" required></textarea>
        <input type="submit" value="Send">
    </form>

    <!-- ✅ 외부 스크립트 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        // ✅ Swiper 초기화
        document.addEventListener("DOMContentLoaded", function () {
            new Swiper(".swiper", {
                loop: true,
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
            });
        });

        // ✅ Chart.js 초기화
        document.addEventListener("DOMContentLoaded", function () {
            const ctx = document.getElementById("myChart");
            new Chart(ctx, {
                type: "line",
                data: {
                    labels: ["Red", "Blue", "Yellow", "Green", "Purple", "Orange"],
                    datasets: [{
                        label: "# of Votes",
                        data: [12, 19, 3, 5, 2, 3],
                        borderWidth: 1,
                    }],
                },
                options: {
                    scales: {
                        y: { beginAtZero: true },
                    },
                },
            });
        });

        // ✅ AOS 초기화
        document.addEventListener("DOMContentLoaded", function () {
            AOS.init({
                duration: 1000, // 애니메이션 지속 시간
                once: false, // 애니메이션 반복
            });
        });

        // ✅ EmailJS 초기화
        (function() {
            emailjs.init({
                publicKey: "YOUR_PUBLIC_KEY",
            });
        })();

        // ✅ EmailJS 폼 처리
        window.onload = function() {
            document.getElementById('contact-form').addEventListener('submit', function(event) {
                event.preventDefault();
                emailjs.sendForm('contact_service', 'contact_form', this)
                    .then(() => {
                        console.log('SUCCESS!');
                    }, (error) => {
                        console.log('FAILED...', error);
                    });
            });
        };
    </script>

</body>
</html>
