<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AJAX 상품 사이즈</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    .form-hide {
      display: none;
    }
  </style>
</head>
<body>

  <form class="container my-5 form-group">
    <p>상품선택</p>

    <!-- 상품 선택 -->
    <select id="product-select" class="form-select mt-2">
      <option value="">상품을 선택하세요</option>
      <option value="모자">모자</option>
      <option value="셔츠">셔츠</option>
      <option value="바지">바지</option>
    </select>

    <!-- 사이즈 선택 -->
    <select id="size-select" class="form-select mt-2 form-hide"></select>
  </form>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    $(document).ready(function () {
      $('#product-select').on('change', function () {
        const selectedProduct = $(this).val();
        const $sizeSelect = $('#size-select');

        // 선택 초기화
        $sizeSelect.empty().addClass('form-hide');

        // 상품이 선택되지 않았으면 종료
        if (!selectedProduct) return;

        // AJAX 요청 (JSON 파일을 가져온다고 가정)
        $.ajax({
          url: 'sizes.json',  // 상품별 사이즈 정보가 들어있는 JSON 파일
          method: 'GET',
          dataType: 'json',
          success: function (data) {
            const sizes = data[selectedProduct]; // 예: data["바지"] = ["28", "30"]

            if (sizes && sizes.length > 0) {
              $sizeSelect.append('<option value="">사이즈를 선택하세요</option>');
              sizes.forEach(size => {
                $sizeSelect.append(`<option value="${size}">${size}</option>`);
              });
              $sizeSelect.removeClass('form-hide');
            }
          },
          error: function () {
            alert('사이즈 정보를 불러오지 못했습니다.');
          }
        });
      });
    });
  </script>

</body>
</html>
